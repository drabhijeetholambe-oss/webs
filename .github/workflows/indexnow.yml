name: IndexNow

# Tells Bing and other IndexNow search engines about every page in the sitemap after a deploy,
# so new and updated pages are picked up quickly. The key file is public/<key>.txt.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  submit:
    runs-on: ubuntu-latest
    env:
      SITE: https://www.drabhijeetholambe.com
      KEY: 8c2d9e3f6a1b4c7d9e2f5a8b1c6d3e7f
    steps:
      - name: Wait for the Vercel production deploy
        run: sleep 180
      - name: Submit sitemap URLs
        run: |
          urls=$(curl -fsS "$SITE/sitemap.xml" | grep -o '<loc>[^<]*' | sed 's/<loc>//' | jq -R . | jq -s -c .)
          body=$(jq -n --arg host "${SITE#https://}" --arg key "$KEY" --arg loc "$SITE/$KEY.txt" --argjson urls "$urls" '{host: $host, key: $key, keyLocation: $loc, urlList: $urls}')
          status=$(curl -sS -o /dev/null -w "%{http_code}" -X POST "https://api.indexnow.org/indexnow" -H "Content-Type: application/json; charset=utf-8" -d "$body")
          echo "IndexNow responded with HTTP $status"
          case "$status" in 200|202) ;; *) exit 1 ;; esac
